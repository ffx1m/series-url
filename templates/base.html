<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Manager | รวบรวมวิดีโอและรูปภาพ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0f172a', /* slate-900 */
                        darker: '#020617', /* slate-950 */
                        card: 'rgba(30, 41, 59, 0.7)', /* slate-800 with opacity */
                        primary: '#3b82f6',
                        primaryHover: '#2563eb',
                        accent: '#8b5cf6'
                    },
                    backdropBlur: {
                        xs: '2px',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background: radial-gradient(circle at top left, #1e293b, #020617);
            background-attachment: fixed;
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .sidebar-link { 
            transition: all 0.3s ease; 
        }
        .sidebar-link:hover { 
            background: rgba(59, 130, 246, 0.1); 
            color: #60a5fa; 
            transform: translateX(4px);
        }
        .sidebar-link.active { 
            background: linear-gradient(90deg, rgba(59,130,246,0.2) 0%, transparent 100%);
            color: #3b82f6; 
            border-left: 3px solid #3b82f6; 
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="flex h-screen overflow-hidden font-sans">

    <!-- Mobile Header -->
    <div class="md:hidden fixed w-full top-0 left-0 h-16 glass-panel flex items-center justify-between px-5 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-primary/20 p-2 rounded-lg text-primary">
                <i class="fa-solid fa-play"></i>
            </div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">SeriesApp</h1>
        </div>
        <button id="mobile-menu-btn" class="text-gray-300 hover:text-white focus:outline-none transition-colors">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 w-64 glass-panel border-r border-white/5 z-40 transition-transform duration-300 flex flex-col pt-16 md:pt-0 shrink-0 shadow-2xl">
        <div class="hidden md:flex h-20 items-center px-6 border-b border-white/5 mb-4">
            <div class="bg-primary/20 p-2 rounded-lg text-primary mr-3 shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-play"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">SeriesApp</h1>
        </div>
        <nav class="flex-1 px-3 py-2 space-y-1.5 overflow-y-auto">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-3 mt-2">เมนูหลัก</div>
            <a href="/" class="sidebar-link flex items-center px-4 py-3 text-slate-300 rounded-xl {% if request.path == '/' %}active{% endif %}">
                <i class="fa-solid fa-chart-pie w-6 text-lg"></i>
                <span class="font-medium">แดชบอร์ด</span>
            </a>
            <a href="/video" class="sidebar-link flex items-center px-4 py-3 text-slate-300 rounded-xl {% if request.path == '/video' %}active{% endif %}">
                <i class="fa-solid fa-video w-6 text-lg"></i>
                <span class="font-medium">จัดการวิดีโอ</span>
            </a>
            <a href="/image" class="sidebar-link flex items-center px-4 py-3 text-slate-300 rounded-xl {% if request.path == '/image' %}active{% endif %}">
                <i class="fa-solid fa-image w-6 text-lg"></i>
                <span class="font-medium">อัพโหลดปก</span>
            </a>
            <a href="/manage" class="sidebar-link flex items-center px-4 py-3 text-slate-300 rounded-xl {% if request.path == '/manage' %}active{% endif %}">
                <i class="fa-solid fa-folder-tree w-6 text-lg"></i>
                <span class="font-medium">คลังไฟล์</span>
            </a>
            
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-3 mt-6">ระบบ</div>
            <a href="/logs" class="sidebar-link flex items-center px-4 py-3 text-slate-300 rounded-xl {% if request.path == '/logs' %}active{% endif %}">
                <i class="fa-solid fa-terminal w-6 text-lg"></i>
                <span class="font-medium">แสดง Log</span>
            </a>
            <a href="/settings" class="sidebar-link flex items-center px-4 py-3 text-slate-300 rounded-xl {% if request.path == '/settings' %}active{% endif %}">
                <i class="fa-solid fa-gear w-6 text-lg"></i>
                <span class="font-medium">ตั้งค่า API</span>
            </a>
        </nav>
        
        <div class="p-4 border-t border-white/5 text-center">
            <p class="text-xs text-slate-500">Powered by R2 & FFmpeg</p>
        </div>
    </aside>

    <!-- Overlay for mobile -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-30 hidden md:hidden transition-opacity"></div>

    <!-- Main Content -->
    <main class="flex-1 relative overflow-y-auto pt-20 md:pt-6 pb-12 px-4 md:px-8">
        <div class="max-w-5xl mx-auto">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        btn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            const bgClass = isError ? 'bg-red-600/90' : 'bg-emerald-600/90';
            const icon = isError ? 'fa-circle-exclamation' : 'fa-check-circle';
            
            toast.className = `fixed top-20 left-1/2 -translate-x-1/2 ${bgClass} backdrop-blur-md border border-white/10 text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 z-50 flex items-center gap-3 opacity-100`;
            toast.style.transform = 'translateX(-50%) translateY(0)';
            toast.innerHTML = `<i class="fa-solid ${icon} text-xl"></i><span class="font-medium">${message}</span>`;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('คัดลอก URL สำเร็จแล้ว');
            } catch (err) {
                showToast('คัดลอกไม่สำเร็จ', true);
            }
        }
        
        async function fetchSeriesOptions() {
            try {
                const res = await fetch('/api/series');
                return await res.json();
            } catch (e) {
                return [];
            }
        }
    </script>
</body>
</html>
